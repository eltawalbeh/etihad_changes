name: QA Bundle
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Consolidated QA checks
        run: npm run qa
      - name: Production bundle build
        run: npm run build
      - name: Dependency security audit
        run: npm audit --audit-level=critical

      - name: Restore original PNG assets into isolated target repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for file in \
            Assets/Images/azerbaijan-cover-01.png \
            Assets/Images/georgia-cover-01.png \
            Assets/Images/istanbul-cover-01.png \
            Assets/Images/kazakhstan-cover-01.png \
            Assets/Images/russia-cover-01.png \
            Assets/Images/trabzon-cover-01.png \
            src/imports/image.png
          do
            if test ! -s "$file"; then
              mkdir -p "$(dirname "$file")"
              curl --fail --location --silent --show-error --retry 3 \
                "https://raw.githubusercontent.com/eltawalbeh/Etihadtourswebsite/main/$file" -o "$file"
              test -s "$file"
            fi
          done
          git add -- Assets/Images src/imports/image.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore original Etihad Tours binary assets"
            git push origin HEAD:main
          fi
